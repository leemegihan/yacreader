name: OCR engine comparison
on:
  push:
    branches: [manga-library-v01]
    paths: ['tools/ocr_benchmark/**', '.github/workflows/ocr-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Windows CPU OCR comparison
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/ocr_benchmark/requirements.txt
      - name: Install comparison engines
        run: |
          python -m pip install -r tools/ocr_benchmark/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'OCR dependencies failed' }
          python -m pip freeze > ocr-packages.txt
          python -m unittest discover -s tools/ocr_benchmark -p test_core.py
          if ($LASTEXITCODE -ne 0) { throw 'Comparison tests failed' }
      - uses: actions/cache/restore@v4
        with:
          path: ocr-build/vcpkg/installed
          key: manga-tesseract-5.5.1-vcpkg-2025.06.13-x64-v1
          fail-on-cache-miss: true
      - uses: actions/checkout@v6
        with:
          repository: tesseract-ocr/tessdata_best
          ref: e2aad9b983032bb1beff9133104a67cdbb87ca4d
          path: tessdata
          sparse-checkout: |
            eng.traineddata
            jpn.traineddata
            jpn_vert.traineddata
            kor.traineddata
          sparse-checkout-cone-mode: false
      - name: Prepare reproducible synthetic layouts
        run: |
          curl.exe --fail --location --retry 3 https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf --output font.otf
          if ($LASTEXITCODE -ne 0) { throw 'Font download failed' }
          python tools/ocr_benchmark/fixtures.py --font font.otf --output fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
      - name: Compare identical page pixels on CPU
        run: |
          $bin = Resolve-Path 'ocr-build/vcpkg/installed/x64-windows/bin'
          $env:PATH = "$bin;$env:PATH"
          python tools/ocr_benchmark/compare.py --detector-model PP-OCRv5_mobile_det --manifest fixtures/manifest.json --output comparison --tesseract ocr-build/vcpkg/installed/x64-windows/tools/tesseract/tesseract.exe --tessdata tessdata
          if ($LASTEXITCODE -ne 0) { throw 'OCR comparison failed' }
          Get-Content comparison/report.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ocr-comparison-${{ github.sha }}
          path: |
            comparison/
            fixtures/
            ocr-packages.txt
          retention-days: 14
