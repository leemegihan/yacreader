name: OCR portability diagnostics
on:
  push:
    branches: [manga-ocr-diagnostics]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libgl-dev libgles2-mesa-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libpoppler-qt6-dev libspeechd-dev tesseract-ocr
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: 'qt5compat qtmultimedia qtimageformats qtshadertools qtspeech'
          cache: true
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPDF_BACKEND=poppler
          cmake --build build --target local_metadata_test --parallel "$(nproc)"
          ctest --test-dir build -R '^local_metadata_test$' --output-on-failure
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: macos
          modules: 'qt5compat qtmultimedia qtimageformats qtshadertools qtspeech'
          cache: true
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPDF_BACKEND=pdfkit -DDECOMPRESSION_BACKEND=7zip
          cmake --build build --target local_metadata_test --parallel "$(sysctl -n hw.ncpu)"
          ctest --test-dir build -R '^local_metadata_test$' --output-on-failure
